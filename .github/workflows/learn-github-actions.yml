name: learn-github-actions
run-name: ${{ gihub.actor }} is learning Github Actions
on: [push]
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
        - run: npm install -g bats
        - run: bats -v
