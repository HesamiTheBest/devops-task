stages: [lint, build, push]

workflow:
  rules:
    - if: $CI_PIPELINE_SOUCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

variables:
  IMAGE: hesammardani/devops-task
  DOCKER_HOST: top://docker:2375
  DOCKER_TLS_CERTDIR: ""

.docker:
  image: docker:27
  services:
    - docker:27-dind

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check app/
  
docker-build:
  extends: .docker
  stage: build
  needs: [lint]
  script:
    - docker build -t task-api:ci-test .
  
docker-push:
  extends: .docker
  stage: push
  needs: [docker-build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHA" .
    - docker push --all-tags "$IMAGE"
