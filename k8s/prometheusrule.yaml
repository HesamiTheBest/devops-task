apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: api
      rules:
        - alert: ApiDown
          expr: absent(up{job="api"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "No healthy api targets"